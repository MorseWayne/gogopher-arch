services:
  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - LISTEN_ADDRESS=0.0.0.0:8080
      - LEARNING_SLICE_ENABLED=true
      - LEARNING_CONTENT_DIR=/app/content/learning
      - LEARNING_SESSION_TTL=${LEARNING_SESSION_TTL:-720h}
      - DATABASE_URL=${DATABASE_URL:-postgres://user:pass@postgres:5432/gogopher?sslmode=disable}
      - DB_MAX_OPEN_CONNECTIONS=${DB_MAX_OPEN_CONNECTIONS:-10}
      - DB_MAX_IDLE_CONNECTIONS=${DB_MAX_IDLE_CONNECTIONS:-5}
      - DB_CONNECTION_LIFETIME=${DB_CONNECTION_LIFETIME:-30m}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: cmd/migrate/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://user:pass@postgres:5432/gogopher?sslmode=disable}
    restart: "no"

  sandbox-engine:
    build:
      context: .
      dockerfile: src/services/sandbox-engine/Dockerfile
    expose:
      - "8081"
    environment:
      - REDIS_URL=${REDIS_URL:-redis:6379}
      - DB_URL=${DB_URL:-postgres://user:pass@postgres:5432/gogopher?sslmode=disable}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pass}
      - POSTGRES_DB=${POSTGRES_DB:-gogopher}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
