x-build-proxy-args: &build-proxy-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  ALL_PROXY: ${ALL_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}

x-build-defaults: &build-defaults
  # Loopback proxies such as 127.0.0.1:10808 are only reachable from build
  # steps on the host network. Set BUILD_NETWORK=default when isolation is
  # preferred and the proxy is reachable from Docker's bridge network.
  network: ${BUILD_NETWORK:-host}
  args: *build-proxy-args

services:
  web:
    build:
      <<: *build-defaults
      context: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      <<: *build-defaults
      context: .
      dockerfile: cmd/gateway/Dockerfile
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      sandbox-engine:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - LISTEN_ADDRESS=0.0.0.0:8080
      - LEARNING_SLICE_ENABLED=${LEARNING_SLICE_ENABLED:-true}
      - LEARNING_CONTENT_DIR=/app/content/learning
      - LEARNING_SESSION_TTL=${LEARNING_SESSION_TTL:-720h}
      - DATABASE_URL=${DATABASE_URL:-postgres://user:pass@postgres:5432/gogopher?sslmode=disable}
      - DB_MAX_OPEN_CONNECTIONS=${DB_MAX_OPEN_CONNECTIONS:-10}
      - DB_MAX_IDLE_CONNECTIONS=${DB_MAX_IDLE_CONNECTIONS:-5}
      - DB_CONNECTION_LIFETIME=${DB_CONNECTION_LIFETIME:-30m}
      - SANDBOX_ENDPOINT=http://sandbox-engine:8081/v1/executions
      - SANDBOX_RESPONSE_GRACE=${SANDBOX_RESPONSE_GRACE:-2s}
      - SANDBOX_RPC_DEADLINE=${SANDBOX_RPC_DEADLINE:-35s}
      - EXECUTION_PERSIST_GRACE=${EXECUTION_PERSIST_GRACE:-5s}
      - EXECUTION_WORKER_LEASE=${EXECUTION_WORKER_LEASE:-45s}
      - EXECUTION_WORKER_HEARTBEAT=${EXECUTION_WORKER_HEARTBEAT:-10s}
      - EXECUTION_WORKER_POLL=${EXECUTION_WORKER_POLL:-250ms}
      - EXECUTION_MAX_CLAIMS=${EXECUTION_MAX_CLAIMS:-3}
      - PROJECTION_WORKER_LEASE=${PROJECTION_WORKER_LEASE:-30s}
      - PROJECTION_WORKER_POLL=${PROJECTION_WORKER_POLL:-250ms}
      - PROJECTION_WORKER_MAX_ATTEMPTS=${PROJECTION_WORKER_MAX_ATTEMPTS:-5}
      - PROJECTION_WORKER_BASE_BACKOFF=${PROJECTION_WORKER_BASE_BACKOFF:-1s}
      - PROJECTION_WORKER_MAX_BACKOFF=${PROJECTION_WORKER_MAX_BACKOFF:-1m}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      <<: *build-defaults
      context: .
      dockerfile: cmd/migrate/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://user:pass@postgres:5432/gogopher?sslmode=disable}
    restart: "no"

  sandbox-engine:
    build:
      <<: *build-defaults
      context: .
      dockerfile: cmd/sandbox/Dockerfile
    expose:
      - "8081"
    environment:
      - SANDBOX_LISTEN_ADDRESS=0.0.0.0:8081
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pass}
      - POSTGRES_DB=${POSTGRES_DB:-gogopher}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
