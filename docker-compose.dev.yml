# Loopback-only ports for local hot development. Production-style Compose
# intentionally keeps Gateway, Sandbox, and PostgreSQL on the internal network.
services:
  gateway:
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"

  sandbox-engine:
    ports:
      - "127.0.0.1:${SANDBOX_PORT:-8081}:8081"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
